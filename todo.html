<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; }

    .card { background: linear-gradient(160deg, #12122a, #0d0d1f); border: 1px solid rgba(255,255,255,0.08); }

    .todo-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      transition: all 0.2s ease;
      animation: slideIn 0.25s ease;
    }
    .todo-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
    .todo-item.done { opacity: 0.45; }
    .todo-item.done .todo-text { text-decoration: line-through; color: #6b7280; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .checkbox-custom {
      width: 20px; height: 20px; border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.18s ease; flex-shrink: 0;
    }
    .checkbox-custom.checked { border-color: #10b981; background: #10b981; }
    .checkbox-custom.checked::after { content: '✓'; color: white; font-size: 11px; font-weight: 700; }

    .priority-badge { font-size: 0.6rem; padding: 2px 7px; border-radius: 99px; font-weight: 600; letter-spacing: 0.04em; }
    .p-high   { background: rgba(239,68,68,0.2);  color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
    .p-mid    { background: rgba(251,191,36,0.2); color: #fde68a; border: 1px solid rgba(251,191,36,0.3); }
    .p-low    { background: rgba(99,102,241,0.2); color: #a5b4fc; border: 1px solid rgba(99,102,241,0.3); }

    .cat-badge { font-size: 0.6rem; padding: 2px 7px; border-radius: 99px; font-weight: 500; background: rgba(255,255,255,0.06); color: #9ca3af; border: 1px solid rgba(255,255,255,0.08); }

    .input-field {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: white; border-radius: 10px; outline: none;
      transition: border-color 0.18s;
    }
    .input-field:focus { border-color: rgba(16,185,129,0.5); }
    .input-field::placeholder { color: #6b7280; }

    select.input-field option { background: #1a1a3e; color: white; }

    .btn-add {
      background: linear-gradient(135deg, #059669, #047857);
      border: 1px solid rgba(16,185,129,0.4); color: white;
      border-radius: 10px; font-weight: 500; cursor: pointer;
      transition: all 0.18s ease;
    }
    .btn-add:hover { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 0 20px rgba(16,185,129,0.3); }

    .filter-btn {
      padding: 5px 14px; border-radius: 8px; font-size: 0.75rem; font-weight: 500;
      border: 1px solid rgba(255,255,255,0.1); color: #6b7280;
      cursor: pointer; transition: all 0.15s; background: transparent;
    }
    .filter-btn.active { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.4); color: #6ee7b7; }

    .glow-line { height: 1px; background: linear-gradient(90deg, transparent, rgba(16,185,129,0.4), transparent); }
    .delete-btn { opacity: 0; transition: opacity 0.15s; background: none; border: none; cursor: pointer; padding: 4px; border-radius: 6px; }
    .todo-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background: rgba(239,68,68,0.2); }

    .stat { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 12px; text-align: center; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
  </style>
</head>
<body class="p-4 min-h-screen">

  <div class="max-w-xl mx-auto">

    <!-- Back Button -->
    <a href="index.html" class="inline-flex items-center gap-2 text-gray-500 hover:text-gray-300 text-sm mb-5 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      대시보드로 돌아가기
    </a>

    <!-- Header -->
    <div class="card rounded-2xl p-5 mb-4">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h1 class="text-white text-2xl font-bold">할 일 관리 ✅</h1>
          <p class="text-gray-500 text-sm mt-0.5" id="date-label"></p>
        </div>
        <div class="text-right">
          <div class="text-2xl font-bold text-emerald-400" id="stat-done">0</div>
          <div class="text-gray-600 text-xs">완료</div>
        </div>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-3 gap-2 mb-4">
        <div class="stat">
          <div class="text-lg font-bold text-white" id="stat-total">0</div>
          <div class="text-gray-600 text-xs">전체</div>
        </div>
        <div class="stat">
          <div class="text-lg font-bold text-yellow-400" id="stat-remain">0</div>
          <div class="text-gray-600 text-xs">남은 항목</div>
        </div>
        <div class="stat">
          <div class="text-lg font-bold text-red-400" id="stat-high">0</div>
          <div class="text-gray-600 text-xs">높은 우선순위</div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="h-1.5 bg-white/5 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-500 to-teal-400 rounded-full transition-all duration-500" style="width:0%"></div>
      </div>
    </div>

    <!-- Input Form -->
    <div class="card rounded-2xl p-4 mb-4">
      <div class="flex gap-2 mb-2">
        <input id="todo-input" type="text" placeholder="할 일을 입력하세요..." class="input-field flex-1 px-4 py-2.5 text-sm" onkeydown="if(event.key==='Enter') addTodo()" />
        <button onclick="addTodo()" class="btn-add px-4 py-2.5 text-sm whitespace-nowrap">+ 추가</button>
      </div>
      <div class="flex gap-2">
        <select id="priority-select" class="input-field flex-1 px-3 py-2 text-sm text-gray-300">
          <option value="mid">⚡ 보통</option>
          <option value="high">🔴 높음</option>
          <option value="low">🔵 낮음</option>
        </select>
        <select id="cat-select" class="input-field flex-1 px-3 py-2 text-sm text-gray-300">
          <option value="일반">일반</option>
          <option value="업무">업무</option>
          <option value="개인">개인</option>
          <option value="학습">학습</option>
          <option value="건강">건강</option>
        </select>
      </div>
    </div>

    <!-- Filter -->
    <div class="flex gap-2 mb-3 flex-wrap">
      <button class="filter-btn active" onclick="setFilter('all', this)">전체</button>
      <button class="filter-btn" onclick="setFilter('remain', this)">미완료</button>
      <button class="filter-btn" onclick="setFilter('done', this)">완료</button>
      <button class="filter-btn" onclick="setFilter('high', this)">🔴 높음</button>
      <button class="filter-btn" onclick="setFilter('업무', this)">업무</button>
      <button class="filter-btn" onclick="setFilter('학습', this)">학습</button>
      <button onclick="clearDone()" class="filter-btn ml-auto" style="color:#f87171;border-color:rgba(239,68,68,0.2)">완료 삭제</button>
    </div>

    <div class="glow-line mb-3"></div>

    <!-- Todo List -->
    <div id="todo-list" class="space-y-2"></div>
    <div id="empty-state" class="text-center py-16 text-gray-600 hidden">
      <div class="text-4xl mb-3">📭</div>
      <div class="text-sm">할 일이 없습니다</div>
    </div>

  </div>

<script>
  let todos = JSON.parse(localStorage.getItem('todos') || '[]');
  let currentFilter = 'all';

  // Date label
  document.getElementById('date-label').textContent =
    new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

  function saveTodos() { localStorage.setItem('todos', JSON.stringify(todos)); }

  function addTodo() {
    const input = document.getElementById('todo-input');
    const text = input.value.trim();
    if (!text) return;
    todos.unshift({
      id: Date.now(),
      text,
      done: false,
      priority: document.getElementById('priority-select').value,
      category: document.getElementById('cat-select').value,
      createdAt: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' })
    });
    input.value = '';
    saveTodos();
    render();
  }

  function toggleTodo(id) {
    const t = todos.find(t => t.id === id);
    if (t) { t.done = !t.done; saveTodos(); render(); }
  }

  function deleteTodo(id) {
    todos = todos.filter(t => t.id !== id);
    saveTodos(); render();
  }

  function clearDone() {
    todos = todos.filter(t => !t.done);
    saveTodos(); render();
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function getFiltered() {
    switch(currentFilter) {
      case 'remain': return todos.filter(t => !t.done);
      case 'done':   return todos.filter(t => t.done);
      case 'high':   return todos.filter(t => t.priority === 'high');
      case '업무':   return todos.filter(t => t.category === '업무');
      case '학습':   return todos.filter(t => t.category === '학습');
      default:       return todos;
    }
  }

  function priorityLabel(p) {
    return { high: '높음', mid: '보통', low: '낮음' }[p] || p;
  }
  function priorityClass(p) {
    return { high: 'p-high', mid: 'p-mid', low: 'p-low' }[p] || 'p-low';
  }

  function render() {
    const list = document.getElementById('todo-list');
    const empty = document.getElementById('empty-state');
    const filtered = getFiltered();

    // Stats
    const total = todos.length;
    const done = todos.filter(t => t.done).length;
    const remain = total - done;
    const high = todos.filter(t => t.priority === 'high' && !t.done).length;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-done').textContent = done;
    document.getElementById('stat-remain').textContent = remain;
    document.getElementById('stat-high').textContent = high;
    document.getElementById('progress-bar').style.width = total ? (done / total * 100) + '%' : '0%';

    if (filtered.length === 0) {
      list.innerHTML = '';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    list.innerHTML = filtered.map(t => `
      <div class="todo-item ${t.done ? 'done' : ''} rounded-xl px-4 py-3 flex items-center gap-3">
        <div class="checkbox-custom ${t.done ? 'checked' : ''}" onclick="toggleTodo(${t.id})"></div>
        <div class="flex-1 min-w-0">
          <div class="todo-text text-sm text-gray-200 leading-snug">${escHtml(t.text)}</div>
          <div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
            <span class="priority-badge ${priorityClass(t.priority)}">${priorityLabel(t.priority)}</span>
            <span class="cat-badge">${escHtml(t.category)}</span>
            <span class="text-gray-700 text-xs">${t.createdAt}</span>
          </div>
        </div>
        <button class="delete-btn" onclick="deleteTodo(${t.id})">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        </button>
      </div>
    `).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  render();
</script>
</body>
</html>
