<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>입고검사 현황 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .header .meta { font-size: 12px; color: #64748b; }

    /* ── Main ── */
    .main { padding: 24px 28px; max-width: 1440px; margin: 0 auto; }

    /* ── KPI ── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px 20px;
    }
    .kpi-card .label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }
    .kpi-card .value { font-size: 30px; font-weight: 700; line-height: 1; margin-bottom: 6px; }
    .kpi-card .sub { font-size: 12px; color: #475569; }
    .kpi-card.blue  .value { color: #60a5fa; }
    .kpi-card.green .value { color: #4ade80; }
    .kpi-card.red   .value { color: #f87171; }
    .kpi-card.amber .value { color: #fbbf24; }

    /* ── Chart grid ── */
    .chart-row {
      display: grid;
      gap: 16px;
      margin-bottom: 20px;
    }
    .chart-row.two { grid-template-columns: 2fr 1fr; }
    .chart-row.one { grid-template-columns: 1fr; }

    .chart-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px 20px;
    }
    .chart-card h3 {
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 14px;
    }

    /* ── Table ── */
    .table-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .table-toolbar {
      padding: 14px 18px;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .table-toolbar h3 { font-size: 13px; font-weight: 600; color: #94a3b8; flex: 1; }

    .ctrl {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 6px 11px;
      color: #cbd5e1;
      font-size: 12px;
      outline: none;
    }
    .ctrl:focus { border-color: #3b82f6; }
    input.ctrl { width: 180px; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    thead th {
      background: #0f172a;
      padding: 9px 14px;
      text-align: left;
      color: #475569;
      font-weight: 600;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid #334155;
    }
    tbody tr { border-bottom: 1px solid #1e293b55; }
    tbody tr:hover { background: rgba(15,23,42,0.6); }
    tbody td { padding: 9px 14px; color: #cbd5e1; vertical-align: middle; }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-pass { background: rgba(74,222,128,0.12); color: #4ade80; }
    .badge-cond { background: rgba(251,191,36,0.12); color: #fbbf24; }
    .badge-fail { background: rgba(248,113,113,0.12); color: #f87171; }

    /* ── Pagination ── */
    .pagination {
      padding: 10px 18px;
      border-top: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-info { font-size: 11px; color: #475569; }
    .page-btns { display: flex; gap: 3px; }
    .pbtn {
      background: #0f172a;
      border: 1px solid #334155;
      color: #64748b;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      transition: all .15s;
    }
    .pbtn:hover:not(:disabled) { background: #1e293b; color: #f1f5f9; }
    .pbtn.active { background: #2563eb; border-color: #2563eb; color: #fff; }
    .pbtn:disabled { opacity: 0.3; cursor: not-allowed; }

    .data-note {
      text-align: center;
      font-size: 11px;
      color: #334155;
      padding-bottom: 8px;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>📦 입고검사 현황 대시보드</h1>
  <div class="meta" id="header-date"></div>
</div>

<div class="main">

  <!-- KPI -->
  <div class="kpi-grid">
    <div class="kpi-card blue">
      <div class="label">총 입고건수</div>
      <div class="value" id="k-total">-</div>
      <div class="sub">전체 기간 누계</div>
    </div>
    <div class="kpi-card green">
      <div class="label">합격률</div>
      <div class="value" id="k-pass-rate">-</div>
      <div class="sub" id="k-pass-sub">합격 -건</div>
    </div>
    <div class="kpi-card red">
      <div class="label">불합격 건수</div>
      <div class="value" id="k-fail">-</div>
      <div class="sub" id="k-fail-sub">불합격률 -%</div>
    </div>
    <div class="kpi-card amber">
      <div class="label">조건부합격</div>
      <div class="value" id="k-cond">-</div>
      <div class="sub" id="k-cond-sub">-%</div>
    </div>
  </div>

  <!-- Charts Row 1 -->
  <div class="chart-row two">
    <div class="chart-card">
      <h3>월별 합격률 추이</h3>
      <canvas id="lineChart" height="180"></canvas>
    </div>
    <div class="chart-card">
      <h3>불량유형 분포</h3>
      <canvas id="pieChart" height="180"></canvas>
    </div>
  </div>

  <!-- Charts Row 2 -->
  <div class="chart-row one">
    <div class="chart-card">
      <h3>공급업체별 불량률</h3>
      <canvas id="barChart" height="100"></canvas>
    </div>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-toolbar">
      <h3>입고검사 목록</h3>
      <input  type="text" id="search"           class="ctrl" placeholder="품목명 검색...">
      <select id="filter-supplier"              class="ctrl"></select>
      <select id="filter-result"                class="ctrl">
        <option value="">검사결과 전체</option>
        <option value="합격">합격</option>
        <option value="조건부합격">조건부합격</option>
        <option value="불합격">불합격</option>
      </select>
    </div>
    <table>
      <thead>
        <tr>
          <th>검사번호</th>
          <th>입고일자</th>
          <th>품목명</th>
          <th>공급업체</th>
          <th style="text-align:right">입고수량</th>
          <th style="text-align:right">불량수량</th>
          <th>검사결과</th>
          <th>불량유형</th>
          <th>검사자</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="pagination">
      <div class="page-info" id="page-info"></div>
      <div class="page-btns" id="page-btns"></div>
    </div>
  </div>
  <div class="data-note">⚡ 시뮬레이션 Mock 데이터 10,000건 — 실제 환경에서는 서버 API + 페이지네이션 적용</div>

</div>

<script>
// ═══════════════════════════════════════════════
//  MOCK DATA GENERATOR
// ═══════════════════════════════════════════════
const SUPPLIERS = [
  '한국금속(주)', '대성부품', '현대소재',
  '삼성스틸', '동원산업', '서울금속', '부산부품(주)'
];
const ITEMS = [
  '스테인리스 볼트 M8', '알루미늄 플레이트 5T', '고무 패킹 A형',
  '스프링 와셔 φ12', '구리 배관 φ15', '철제 브라켓 L형',
  'PC 플라스틱 커버', '실리콘 오링 #25', '스틸 너트 M10', '아크릴 판재 3T'
];
const DEFECT_TYPES = ['치수불량', '외관불량', '재질불량', '기능불량', '포장불량'];
const INSPECTORS   = ['김철수', '이영희', '박민준', '최수진', '정대현'];

function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function randomDate(s, e) {
  const st = new Date(s).getTime(), et = new Date(e).getTime();
  return new Date(st + Math.random() * (et - st)).toISOString().slice(0, 10);
}

function generateData(n = 10000) {
  const rows = [];
  for (let i = 0; i < n; i++) {
    const r = Math.random();
    let result, defectType;
    if      (r < 0.78) { result = '합격';      defectType = null; }
    else if (r < 0.90) { result = '조건부합격'; defectType = rnd(DEFECT_TYPES); }
    else               { result = '불합격';      defectType = rnd(DEFECT_TYPES); }

    const qty = Math.floor(Math.random() * 9900) + 100;
    rows.push({
      id:         `INS-${String(i + 1).padStart(7, '0')}`,
      date:       randomDate('2023-01-01', '2024-12-31'),
      supplier:   rnd(SUPPLIERS),
      item:       rnd(ITEMS),
      quantity:   qty,
      defectQty:  result === '합격' ? 0 : Math.floor(qty * (Math.random() * 0.08 + 0.01)),
      result,
      defectType,
      inspector:  rnd(INSPECTORS)
    });
  }
  return rows.sort((a, b) => b.date.localeCompare(a.date));
}

const ALL = generateData(10000);

// ═══════════════════════════════════════════════
//  KPI
// ═══════════════════════════════════════════════
function renderKPI(data) {
  const n    = data.length;
  const pass = data.filter(d => d.result === '합격').length;
  const fail = data.filter(d => d.result === '불합격').length;
  const cond = data.filter(d => d.result === '조건부합격').length;

  document.getElementById('k-total').textContent     = n.toLocaleString();
  document.getElementById('k-pass-rate').textContent = (pass / n * 100).toFixed(1) + '%';
  document.getElementById('k-pass-sub').textContent  = `합격 ${pass.toLocaleString()}건`;
  document.getElementById('k-fail').textContent      = fail.toLocaleString();
  document.getElementById('k-fail-sub').textContent  = `불합격률 ${(fail / n * 100).toFixed(1)}%`;
  document.getElementById('k-cond').textContent      = cond.toLocaleString();
  document.getElementById('k-cond-sub').textContent  = `${(cond / n * 100).toFixed(1)}%`;
}

// ═══════════════════════════════════════════════
//  CHARTS
// ═══════════════════════════════════════════════
Chart.defaults.color       = '#64748b';
Chart.defaults.borderColor = '#1e293b';

let _line, _bar, _pie;

function buildLine(data) {
  const mo = {};
  data.forEach(d => {
    const k = d.date.slice(0, 7);
    if (!mo[k]) mo[k] = { pass: 0, n: 0 };
    mo[k].n++;
    if (d.result === '합격') mo[k].pass++;
  });
  const keys   = Object.keys(mo).sort();
  const labels = keys.map(k => k.slice(2).replace('-', '/'));
  const vals   = keys.map(k => +(mo[k].pass / mo[k].n * 100).toFixed(1));

  if (_line) _line.destroy();
  _line = new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '합격률(%)',
        data: vals,
        borderColor: '#3b82f6',
        backgroundColor: 'rgba(59,130,246,0.08)',
        fill: true,
        tension: 0.4,
        pointRadius: 4,
        pointBackgroundColor: '#3b82f6',
        pointBorderColor: '#1e293b',
        pointBorderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => ` ${ctx.parsed.y}%` }
      }},
      scales: {
        y: { min: 55, max: 100, ticks: { callback: v => v + '%' }, grid: { color: '#334155' } },
        x: { grid: { color: '#334155' } }
      }
    }
  });
}

function buildBar(data) {
  const sup = {};
  data.forEach(d => {
    if (!sup[d.supplier]) sup[d.supplier] = { bad: 0, n: 0 };
    sup[d.supplier].n++;
    if (d.result !== '합격') sup[d.supplier].bad++;
  });
  const labels = Object.keys(sup).sort();
  const vals   = labels.map(k => +(sup[k].bad / sup[k].n * 100).toFixed(1));
  const colors = vals.map(v => v >= 25 ? '#f87171' : v >= 18 ? '#fbbf24' : '#60a5fa');

  if (_bar) _bar.destroy();
  _bar = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: '불량률(%)',
        data: vals,
        backgroundColor: colors,
        borderRadius: 6,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => ` ${ctx.parsed.y}%` }
      }},
      scales: {
        y: { ticks: { callback: v => v + '%' }, grid: { color: '#334155' } },
        x: { grid: { display: false } }
      }
    }
  });
}

function buildPie(data) {
  const dt = {};
  data.filter(d => d.defectType).forEach(d => {
    dt[d.defectType] = (dt[d.defectType] || 0) + 1;
  });
  const labels = Object.keys(dt);
  const vals   = labels.map(k => dt[k]);

  if (_pie) _pie.destroy();
  _pie = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data: vals,
        backgroundColor: ['#3b82f6','#f87171','#fbbf24','#4ade80','#a78bfa'],
        borderWidth: 2,
        borderColor: '#1e293b',
        hoverOffset: 6,
      }]
    },
    options: {
      responsive: true,
      cutout: '62%',
      plugins: {
        legend: {
          position: 'bottom',
          labels: { padding: 14, font: { size: 11 }, boxWidth: 12 }
        }
      }
    }
  });
}

// ═══════════════════════════════════════════════
//  TABLE + PAGINATION
// ═══════════════════════════════════════════════
const PAGE_SIZE = 15;
let curPage = 1;
let filtered = ALL;

function applyFilter() {
  const q  = document.getElementById('search').value.toLowerCase().trim();
  const sp = document.getElementById('filter-supplier').value;
  const rs = document.getElementById('filter-result').value;
  filtered = ALL.filter(d => {
    if (q  && !d.item.toLowerCase().includes(q))    return false;
    if (sp && d.supplier !== sp)                     return false;
    if (rs && d.result   !== rs)                     return false;
    return true;
  });
  curPage = 1;
  renderTable();
}

function badgeCls(r) {
  return r === '합격' ? 'badge badge-pass' : r === '조건부합격' ? 'badge badge-cond' : 'badge badge-fail';
}

function renderTable() {
  const total = filtered.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  curPage = Math.min(curPage, pages);
  const s = (curPage - 1) * PAGE_SIZE;
  const slice = filtered.slice(s, s + PAGE_SIZE);

  document.getElementById('tbody').innerHTML = slice.map(d => `
    <tr>
      <td style="font-family:monospace;color:#475569;font-size:11px">${d.id}</td>
      <td>${d.date}</td>
      <td>${d.item}</td>
      <td>${d.supplier}</td>
      <td style="text-align:right">${d.quantity.toLocaleString()}</td>
      <td style="text-align:right;color:${d.defectQty > 0 ? '#f87171' : '#334155'}">${d.defectQty > 0 ? d.defectQty.toLocaleString() : '-'}</td>
      <td><span class="${badgeCls(d.result)}">${d.result}</span></td>
      <td style="color:#64748b">${d.defectType || '-'}</td>
      <td style="color:#94a3b8">${d.inspector}</td>
    </tr>`).join('');

  document.getElementById('page-info').textContent =
    `${total.toLocaleString()}건 중 ${s + 1}–${Math.min(s + PAGE_SIZE, total)}`;

  // Pagination buttons
  const btns = [];
  btns.push(`<button class="pbtn" onclick="go(${curPage-1})" ${curPage===1?'disabled':''}>‹</button>`);
  let lo = Math.max(1, curPage - 2), hi = Math.min(pages, lo + 4);
  if (hi - lo < 4) lo = Math.max(1, hi - 4);
  for (let p = lo; p <= hi; p++)
    btns.push(`<button class="pbtn ${p===curPage?'active':''}" onclick="go(${p})">${p}</button>`);
  btns.push(`<button class="pbtn" onclick="go(${curPage+1})" ${curPage===pages?'disabled':''}>›</button>`);
  document.getElementById('page-btns').innerHTML = btns.join('');
}

function go(p) { curPage = p; renderTable(); }

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
function init() {
  document.getElementById('header-date').textContent =
    new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

  // Supplier dropdown
  const sel = document.getElementById('filter-supplier');
  sel.innerHTML = '<option value="">공급업체 전체</option>' +
    SUPPLIERS.map(s => `<option value="${s}">${s}</option>`).join('');

  renderKPI(ALL);
  buildLine(ALL);
  buildBar(ALL);
  buildPie(ALL);
  renderTable();

  document.getElementById('search').addEventListener('input', applyFilter);
  document.getElementById('filter-supplier').addEventListener('change', applyFilter);
  document.getElementById('filter-result').addEventListener('change', applyFilter);
}

init();
</script>
</body>
</html>
