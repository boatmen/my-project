<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; }

    .card {
      background: linear-gradient(160deg, #12122a, #0d0d1f);
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.18); box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .card:hover::before { opacity: 1; }
    .card-calc::before { background: linear-gradient(135deg, rgba(124,58,237,0.08), transparent); }
    .card-todo::before { background: linear-gradient(135deg, rgba(16,185,129,0.08), transparent); }

    .icon-wrap { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .icon-calc { background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(99,102,241,0.15)); border: 1px solid rgba(124,58,237,0.3); }
    .icon-todo { background: linear-gradient(135deg, rgba(16,185,129,0.3), rgba(5,150,105,0.15)); border: 1px solid rgba(16,185,129,0.3); }

    .tag { font-size: 0.65rem; padding: 2px 8px; border-radius: 99px; font-weight: 500; letter-spacing: 0.05em; }

    .btn-go {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 20px; border-radius: 10px; font-size: 0.875rem; font-weight: 500;
      transition: all 0.18s ease; text-decoration: none;
    }
    .btn-calc { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: white; border: 1px solid rgba(139,92,246,0.4); }
    .btn-calc:hover { background: linear-gradient(135deg, #8b5cf6, #7c3aed); box-shadow: 0 0 20px rgba(124,58,237,0.4); }
    .btn-todo { background: linear-gradient(135deg, #059669, #047857); color: white; border: 1px solid rgba(16,185,129,0.4); }
    .btn-todo:hover { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 0 20px rgba(16,185,129,0.4); }

    .glow-line { height: 1px; background: linear-gradient(90deg, transparent, rgba(99,102,241,0.5), transparent); }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-6 min-h-screen">

  <div class="w-full max-w-2xl">

    <!-- Header -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center gap-2 bg-white/5 border border-white/10 rounded-full px-4 py-1.5 mb-4">
        <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
        <span class="text-gray-400 text-xs tracking-widest font-medium">DASHBOARD</span>
      </div>
      <h1 class="text-white text-4xl font-bold tracking-tight mb-2">My Workspace</h1>
      <p class="text-gray-500 text-sm">필요한 도구를 바로 선택하세요</p>
      <div class="glow-line mt-6"></div>
    </div>

    <!-- Cards Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">

      <!-- Calculator Card -->
      <div class="card card-calc rounded-2xl p-6">
        <div class="flex items-start justify-between mb-4">
          <div class="icon-wrap icon-calc">🧮</div>
          <span class="tag bg-violet-500/15 text-violet-300 border border-violet-500/20">과학</span>
        </div>
        <h2 class="text-white text-xl font-semibold mb-1">공학용 계산기</h2>
        <p class="text-gray-500 text-sm mb-5 leading-relaxed">삼각함수, 로그, 제곱근 등 고급 수학 연산을 지원하는 계산기</p>
        <div class="flex gap-2 mb-5">
          <span class="tag bg-white/5 text-gray-400 border border-white/8">sin/cos/tan</span>
          <span class="tag bg-white/5 text-gray-400 border border-white/8">log/ln</span>
          <span class="tag bg-white/5 text-gray-400 border border-white/8">메모리</span>
        </div>
        <a href="calculator.html" class="btn-go btn-calc w-full justify-center">
          열기
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </a>
      </div>

      <!-- Todo Card -->
      <div class="card card-todo rounded-2xl p-6">
        <div class="flex items-start justify-between mb-4">
          <div class="icon-wrap icon-todo">✅</div>
          <span class="tag bg-emerald-500/15 text-emerald-300 border border-emerald-500/20">생산성</span>
        </div>
        <h2 class="text-white text-xl font-semibold mb-1">할 일 관리</h2>
        <p class="text-gray-500 text-sm mb-5 leading-relaxed">우선순위와 카테고리로 할 일을 체계적으로 관리하는 To-do 앱</p>
        <div class="flex gap-2 mb-5">
          <span class="tag bg-white/5 text-gray-400 border border-white/8">우선순위</span>
          <span class="tag bg-white/5 text-gray-400 border border-white/8">카테고리</span>
          <span class="tag bg-white/5 text-gray-400 border border-white/8">필터</span>
        </div>
        <a href="todo.html" class="btn-go btn-todo w-full justify-center">
          열기
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </a>
      </div>

    </div>

    <!-- Footer -->
    <div class="glow-line mb-4"></div>
    <div class="flex justify-between items-center text-xs text-gray-600">
      <span>boatmen / my-project</span>
      <span id="clock"></span>
    </div>

  </div>

  <script>
    function updateClock() {
      document.getElementById('clock').textContent =
        new Date().toLocaleString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
